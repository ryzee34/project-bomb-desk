<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bomb Desk</title>
    <meta name="description" content="A typing battle royale in a dark basement. Every third slip, the device on your desk cuts a wire." />
    <meta name="theme-color" content="#060606" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="scene"></div>
    <div class="grain" id="grain"></div>
    <div class="vignette"></div>
    <div class="hurt" id="hurt"></div>

    <div class="hud">
      <div><strong>Desk 4</strong> &nbsp;&middot;&nbsp; round <span id="round">1</span> &nbsp;&middot;&nbsp; line <span id="line">1</span> of 3</div>
      <div class="right">
        <div class="timer" id="timer">0:40</div>
      </div>
    </div>

    <div class="status" id="status" aria-live="polite"></div>
    <div class="strip" id="strip"></div>

    <div class="overlay" id="intro">
      <div class="card">
        <p class="eyebrow">Desk 4</p>
        <h1>BOMB DESK</h1>
        <p>You're at a desk in a basement with one lamp and a device that counts down. Type each line exactly as it's written. Capitals don't matter, but every other key does.</p>
        <p class="small">Needs a keyboard</p>
        <button class="btn" id="start">Sit down</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
